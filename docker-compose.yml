# Local development infrastructure.
# Usage:
#   docker compose up -d
#   DATABASE_URL="postgresql://postgres:postgres@localhost:5432/extracurriculars?schema=public" npm run db:deploy
#   npm run db:seed && npm run dev
#
# The Next.js app runs on the host (npm run dev) and connects to these services.
# Redis is provided for the parser's queue (Celery/Dramatiq) in production.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: extracurriculars
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
