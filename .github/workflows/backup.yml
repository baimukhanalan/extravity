name: Nightly DB backup

# Second line of defence on top of Neon's continuous PITR: a portable pg_dump
# kept as a workflow artifact. Runs only when the DATABASE_URL secret exists, so
# a fork without secrets doesn't fail. Add the secret as DATABASE_URL_UNPOOLED
# (the Neon direct/unpooled connection string).
on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily
  workflow_dispatch: {}

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard — secret present
        id: guard
        run: |
          if [ -n "${{ secrets.DATABASE_URL_UNPOOLED }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "DATABASE_URL_UNPOOLED secret not set — skipping backup."
          fi

      # Match pg_dump's major version to Neon's server (currently 17).
      - name: Install postgresql-client-17
        if: steps.guard.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gpg
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            --retry 4 --retry-all-errors --retry-delay 3 \
            --connect-timeout 15 --max-time 30 \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          gpg --show-keys --with-colons /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            | grep -Fq 'B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8'
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$(lsb_release -cs)" \
            | sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump
        if: steps.guard.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
          PATH: /usr/lib/postgresql/17/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: ./scripts/backup.sh backups

      - name: Upload artifact
        if: steps.guard.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backups/*.dump
          retention-days: 30
