# Source connectors for the parser.
#
# Each source is fetched, extracted, normalized and ingested into the app's
# moderation queue. The parser respects robots.txt and rate limits, and NEVER
# uses public endpoints and documented access methods. Only add sources you are allowed to
# read (official sites, RSS, sitemaps, partners).
#
# type: html | rss | sitemap
# For html/sitemap the parser reads schema.org Event JSON-LD and OpenGraph.
# organizer: default organizer name if the page doesn't provide one.
# category: default category slug when it can't be inferred.

sources:
  - name: "Astana Hub — upcoming events"
    type: astanahub_events
    url: "https://astanahub.com/en/event/"
    organizer: "Astana Hub"
    category: "startup"
    max_pages: 100
    rate_limit_ms: 3000
    enabled: true

